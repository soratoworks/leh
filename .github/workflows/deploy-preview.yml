name: Deploy preview (XServer)

# preview（XServer soratoworks.xsrv.jp/preview_leh/）へ自動デプロイ。
# master への push で自動起動。手動でも回せる（Actions画面の Run workflow）。
# ※本番（lolipop）は別ワークフローで手動のみにする予定。

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 変更ファイル検出(git diff)に全履歴が必要

      # ① デプロイ前チェック: 触ったシーズン画像のリンク切れがあれば止める（連番の抜けは警告のみ）
      - name: Static asset check
        env:
          CHECK_BASE: ${{ github.event.before || 'HEAD~1' }}
        run: python3 tools/check_assets.py

      - name: FTP Deploy to preview
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps          # XServer は明示FTPS対応。もし繋がらなければ ftp に変更
          port: 21
          # ローカルの htdocs/ の中身を preview_leh/ へ同期（変更ファイルのみ）
          local-dir: ./htdocs/
          # ↓ FTPアカウントのホーム基準のパス。XServerのFTPは /home/soratoworks/ がルート想定。
          #    もし階層が違ったらここだけ直す。
          server-dir: soratoworks.xsrv.jp/public_html/preview_leh/
          # サーバー側の認証・htaccess系は絶対に上書きしない（事故防止）
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store
            **/._*
            **/.htaccess
            _.htaccess
            prd.htaccess.txt
            htpasswd/**
            .github/**
            tools/**
            README*

      # ② デプロイ後チェック: preview実物の主要ページで画像が全部表示できるか（今日のサーバー側抜けを捕捉）
      #    Basic認証情報(secrets)が未設定なら自動スキップ。
      - name: Live preview check
        env:
          PREVIEW_BASE: http://soratoworks.xsrv.jp/preview_leh/   # xsrv初期ドメインはHTTPSが別vhostに飛ぶためHTTP固定
          PREVIEW_USER: ${{ secrets.PREVIEW_USER }}
          PREVIEW_PASS: ${{ secrets.PREVIEW_PASS }}
        run: python3 tools/check_live.py
